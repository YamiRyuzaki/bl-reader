<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BL Shelf — Your Boys Love Library</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #c084fc;
    --accent2: #818cf8;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #f87171;
    --success: #34d399;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* noise overlay */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:0;
    opacity:0.4;
  }

  /* NAV */
  nav {
    position: sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
    background: rgba(13,13,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--accent);
  }
  .logo span { color: var(--text); font-style: italic; }
  .nav-tabs { display:flex; gap:4px; }
  .nav-tab {
    background:none; border:none; color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem; letter-spacing:0.1em;
    padding: 7px 14px; border-radius:6px; cursor:pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .nav-tab:hover { color: var(--text); background: var(--surface2); }
  .nav-tab.active { color: var(--accent); background: rgba(192,132,252,0.1); }

  /* PAGES */
  .page { display:none; padding: 24px; position:relative; z-index:1; }
  .page.active { display:block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* LIBRARY PAGE */
  .page-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300;
    color: var(--text);
  }
  .page-title em { color: var(--accent); font-style:italic; }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border:none; color:#fff;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem; letter-spacing:0.08em;
    padding: 10px 20px; border-radius:8px; cursor:pointer;
    transition: all 0.2s; text-transform:uppercase;
  }
  .add-btn:hover { opacity:0.85; transform:translateY(-1px); }

  /* FILTER CHIPS */
  .filter-row { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .chip {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-family:'DM Mono',monospace;
    font-size:0.68rem; letter-spacing:0.06em;
    padding: 6px 14px; border-radius:99px; cursor:pointer;
    transition: all 0.2s; text-transform:uppercase;
  }
  .chip:hover, .chip.active {
    color: var(--accent); border-color: var(--accent);
    background: rgba(192,132,252,0.08);
  }

  /* GRID */
  .manga-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px;
  }
  .manga-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position:relative;
  }
  .manga-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(192,132,252,0.15);
  }
  .manga-cover {
    width:100%; aspect-ratio: 3/4;
    object-fit:cover;
    display:block;
    background: var(--surface2);
  }
  .cover-placeholder {
    width:100%; aspect-ratio:3/4;
    background: linear-gradient(135deg, var(--surface2), #1e1e2e);
    display:flex; align-items:center; justify-content:center;
    font-size:2.5rem;
  }
  .manga-info { padding: 10px; }
  .manga-title {
    font-family:'Cormorant Garamond',serif;
    font-size:0.9rem; font-weight:400;
    color:var(--text); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .manga-meta {
    font-size:0.62rem; color:var(--muted);
    margin-top:5px; letter-spacing:0.05em;
  }
  .progress-bar-wrap {
    height:2px; background:var(--border);
    border-radius:99px; margin-top:7px;
  }
  .progress-bar {
    height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s;
  }
  .badge {
    position:absolute; top:8px; right:8px;
    font-size:0.6rem; letter-spacing:0.05em;
    padding:3px 7px; border-radius:99px;
    text-transform:uppercase;
  }
  .badge-bookmark { background:rgba(192,132,252,0.2); color:var(--accent); }
  .badge-new { background:rgba(52,211,153,0.2); color:var(--success); }

  /* EMPTY STATE */
  .empty-state {
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty-state .icon { font-size:3rem; margin-bottom:16px; opacity:0.5; }
  .empty-state p { font-size:0.8rem; line-height:1.6; }

  /* MODAL */
  .modal-overlay {
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open { display:flex; animation: fadeIn 0.2s ease; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; width:100%; max-width:420px;
    padding:28px; position:relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-title {
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem; font-weight:300; margin-bottom:20px;
    color:var(--accent);
  }
  .modal-close {
    position:absolute; top:16px; right:16px;
    background:none; border:none; color:var(--muted);
    font-size:1.2rem; cursor:pointer; padding:4px;
  }
  .modal-close:hover { color:var(--text); }
  .form-group { margin-bottom:16px; }
  .form-label {
    display:block; font-size:0.68rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:7px;
  }
  .form-input {
    width:100%; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-family:'DM Mono',monospace; font-size:0.82rem;
    padding:10px 14px; border-radius:8px; outline:none;
    transition:border-color 0.2s;
  }
  .form-input:focus { border-color:var(--accent); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions { display:flex; gap:10px; margin-top:22px; }
  .btn-save {
    flex:1; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; color:#fff; font-family:'DM Mono',monospace;
    font-size:0.75rem; letter-spacing:0.08em;
    padding:11px; border-radius:8px; cursor:pointer;
    text-transform:uppercase; transition:opacity 0.2s;
  }
  .btn-save:hover { opacity:0.85; }
  .btn-cancel {
    background:var(--surface2); border:1px solid var(--border);
    color:var(--muted); font-family:'DM Mono',monospace;
    font-size:0.75rem; padding:11px 20px; border-radius:8px; cursor:pointer;
    text-transform:uppercase; transition:all 0.2s;
  }
  .btn-cancel:hover { color:var(--text); }

  /* DETAIL VIEW */
  .detail-back {
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:none; color:var(--muted);
    font-family:'DM Mono',monospace; font-size:0.75rem;
    letter-spacing:0.06em; cursor:pointer; margin-bottom:24px;
    text-transform:uppercase; transition:color 0.2s;
  }
  .detail-back:hover { color:var(--accent); }
  .detail-hero {
    display:flex; gap:24px; margin-bottom:28px;
    flex-wrap:wrap;
  }
  .detail-cover {
    width:130px; flex-shrink:0; border-radius:10px;
    overflow:hidden; border:1px solid var(--border);
    aspect-ratio:3/4; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-size:3rem;
  }
  .detail-cover img { width:100%; height:100%; object-fit:cover; }
  .detail-info { flex:1; min-width:180px; }
  .detail-title {
    font-family:'Cormorant Garamond',serif;
    font-size:1.8rem; font-weight:300; line-height:1.2;
    color:var(--text); margin-bottom:8px;
  }
  .detail-author { font-size:0.75rem; color:var(--muted); margin-bottom:16px; }
  .detail-stats { display:flex; gap:20px; margin-bottom:18px; flex-wrap:wrap; }
  .stat { }
  .stat-label { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .stat-value { font-size:0.95rem; color:var(--accent); margin-top:3px; }
  .detail-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-action {
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-family:'DM Mono',monospace;
    font-size:0.7rem; letter-spacing:0.06em;
    padding:9px 16px; border-radius:8px; cursor:pointer;
    text-transform:uppercase; transition:all 0.2s;
  }
  .btn-action:hover { border-color:var(--accent); color:var(--accent); }
  .btn-action.active { background:rgba(192,132,252,0.1); border-color:var(--accent); color:var(--accent); }
  .btn-read {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; color:#fff; font-family:'DM Mono',monospace;
    font-size:0.7rem; letter-spacing:0.08em;
    padding:9px 20px; border-radius:8px; cursor:pointer;
    text-transform:uppercase; transition:opacity 0.2s;
  }
  .btn-read:hover { opacity:0.85; }
  .detail-progress { margin-bottom:24px; }
  .progress-label { font-size:0.68rem; color:var(--muted); margin-bottom:8px; letter-spacing:0.06em; }
  .progress-big-wrap { height:6px; background:var(--border); border-radius:99px; }
  .progress-big { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 0.4s; }
  .chapters-section { margin-top:8px; }
  .section-title {
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem; font-weight:400; color:var(--muted);
    margin-bottom:14px; letter-spacing:0.05em;
  }
  .chapters-list { display:flex; flex-direction:column; gap:8px; }
  .chapter-item {
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; padding:12px 16px; cursor:pointer;
    transition:all 0.2s;
  }
  .chapter-item:hover { border-color:var(--accent); }
  .chapter-item.read { opacity:0.5; }
  .ch-title { font-size:0.8rem; color:var(--text); }
  .ch-badge { font-size:0.62rem; color:var(--success); background:rgba(52,211,153,0.1); padding:3px 8px; border-radius:99px; }
  .ch-badge.unread { color:var(--muted); background:none; }
  .ch-num { font-size:0.7rem; color:var(--muted); }

  /* BOOKMARKS */
  .bookmarks-list { display:flex; flex-direction:column; gap:10px; }
  .bookmark-item {
    display:flex; align-items:center; gap:16px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; cursor:pointer;
    transition:all 0.2s;
  }
  .bookmark-item:hover { border-color:var(--accent); transform:translateX(4px); }
  .bm-icon { font-size:1.5rem; width:40px; text-align:center; flex-shrink:0; }
  .bm-info { flex:1; }
  .bm-title { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--text); }
  .bm-meta { font-size:0.68rem; color:var(--muted); margin-top:3px; }
  .bm-remove {
    background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:0.9rem; padding:4px;
    transition:color 0.2s;
  }
  .bm-remove:hover { color:var(--danger); }

  /* PROGRESS PAGE */
  .progress-cards { display:flex; flex-direction:column; gap:12px; }
  .prog-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:16px; cursor:pointer;
    transition:all 0.2s;
  }
  .prog-card:hover { border-color:var(--accent); }
  .prog-header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .prog-icon { font-size:1.8rem; }
  .prog-title-wrap { flex:1; }
  .prog-title { font-family:'Cormorant Garamond',serif; font-size:1.05rem; color:var(--text); }
  .prog-sub { font-size:0.68rem; color:var(--muted); margin-top:2px; }
  .prog-pct { font-size:0.8rem; color:var(--accent); }
  .prog-bar-track { height:4px; background:var(--border); border-radius:99px; }
  .prog-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }

  /* TOAST */
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-family:'DM Mono',monospace; font-size:0.75rem;
    letter-spacing:0.05em; padding:11px 20px; border-radius:99px;
    z-index:999; opacity:0; transition:all 0.3s; white-space:nowrap;
    pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* READER */
  .reader-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .reader-title { font-family:'Cormorant Garamond',serif; font-size:1.2rem; color:var(--muted); }
  .reader-images { display:flex; flex-direction:column; gap:2px; }
  .reader-page {
    width:100%; max-width:720px; margin:0 auto;
    display:block; border-radius:4px; background:var(--surface2);
    min-height:200px;
  }
  .reader-page-placeholder {
    width:100%; max-width:720px; margin:0 auto;
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    border-radius:4px; aspect-ratio:3/4;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem; color:var(--muted); font-style:italic;
    text-align:center; padding:20px;
  }
  .reader-nav {
    display:flex; gap:12px; justify-content:center; margin-top:24px;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); }
</style>
</head>
<body>

<nav>
  <div class="logo">BL <span>Shelf</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('library')">Library</button>
    <button class="nav-tab" onclick="showPage('bookmarks')">Saved</button>
    <button class="nav-tab" onclick="showPage('progress')">Progress</button>
  </div>
</nav>

<!-- LIBRARY PAGE -->
<div class="page active" id="page-library">
  <div class="page-header">
    <h1 class="page-title">Your <em>Library</em></h1>
    <button class="add-btn" onclick="openAddModal()">+ Add Manhwa</button>
  </div>
  <div class="filter-row">
    <button class="chip active" onclick="filterLib('all',this)">All</button>
    <button class="chip" onclick="filterLib('reading',this)">Reading</button>
    <button class="chip" onclick="filterLib('completed',this)">Completed</button>
    <button class="chip" onclick="filterLib('bookmarked',this)">Bookmarked</button>
  </div>
  <div class="manga-grid" id="manga-grid"></div>
</div>

<!-- BOOKMARKS PAGE -->
<div class="page" id="page-bookmarks">
  <div class="page-header">
    <h1 class="page-title">Saved <em>Titles</em></h1>
  </div>
  <div class="bookmarks-list" id="bookmarks-list"></div>
</div>

<!-- PROGRESS PAGE -->
<div class="page" id="page-progress">
  <div class="page-header">
    <h1 class="page-title">Reading <em>Progress</em></h1>
  </div>
  <div class="progress-cards" id="progress-cards"></div>
</div>

<!-- DETAIL PAGE -->
<div class="page" id="page-detail">
  <button class="detail-back" onclick="showPage('library')">← Back to Library</button>
  <div id="detail-content"></div>
</div>

<!-- READER PAGE -->
<div class="page" id="page-reader">
  <div id="reader-content"></div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeAddModal()">✕</button>
    <div class="modal-title">Add Manhwa</div>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input class="form-input" id="inp-title" placeholder="e.g. Semantic Error" type="text"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Author</label>
        <input class="form-input" id="inp-author" placeholder="Author name" type="text"/>
      </div>
      <div class="form-group">
        <label class="form-label">Total Chapters</label>
        <input class="form-input" id="inp-total" placeholder="e.g. 80" type="number" min="1"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Chapters Read</label>
        <input class="form-input" id="inp-read" placeholder="0" type="number" min="0"/>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="inp-status">
          <option value="reading">Reading</option>
          <option value="completed">Completed</option>
          <option value="on-hold">On Hold</option>
          <option value="plan">Plan to Read</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Cover Image URL (optional)</label>
      <input class="form-input" id="inp-cover" placeholder="https://..." type="url"/>
    </div>
    <div class="form-group">
      <label class="form-label">Notes / Description</label>
      <input class="form-input" id="inp-notes" placeholder="Any notes..." type="text"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" onclick="saveManhwa()">Save to Library</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- STATE ----
let library = JSON.parse(localStorage.getItem('bl_library') || '[]');
let currentFilter = 'all';
let editingId = null;

function save() {
  localStorage.setItem('bl_library', JSON.stringify(library));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

const EMOJIS = ['🌸','💜','🌙','⭐','🌿','🔮','🫧','🍵','✨','🌺'];
function emoji(id) {
  let n = 0; for(let c of id) n += c.charCodeAt(0);
  return EMOJIS[n % EMOJIS.length];
}

// ---- PAGES ----
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const map = {library:0, bookmarks:1, progress:2};
  if(map[name] !== undefined) document.querySelectorAll('.nav-tab')[map[name]].classList.add('active');
  if(name === 'library') renderLibrary();
  if(name === 'bookmarks') renderBookmarks();
  if(name === 'progress') renderProgress();
}

// ---- LIBRARY ----
function filterLib(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-row .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderLibrary();
}

function renderLibrary() {
  const grid = document.getElementById('manga-grid');
  let items = library;
  if(currentFilter === 'reading') items = items.filter(m => m.status === 'reading');
  if(currentFilter === 'completed') items = items.filter(m => m.status === 'completed');
  if(currentFilter === 'bookmarked') items = items.filter(m => m.bookmarked);

  if(!items.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">📚</div>
      <p>Your library is empty~<br>Add your first BL manhwa!</p>
    </div>`;
    return;
  }

  grid.innerHTML = items.map(m => {
    const pct = m.total ? Math.round((m.read||0)/m.total*100) : 0;
    const cover = m.cover
      ? `<img class="manga-cover" src="${m.cover}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="${m.title}"/><div class="cover-placeholder" style="display:none">${emoji(m.id)}</div>`
      : `<div class="cover-placeholder">${emoji(m.id)}</div>`;
    return `<div class="manga-card" onclick="showDetail('${m.id}')">
      ${m.bookmarked ? '<div class="badge badge-bookmark">♥ saved</div>' : ''}
      ${cover}
      <div class="manga-info">
        <div class="manga-title">${m.title}</div>
        <div class="manga-meta">${m.author || 'Unknown'} · Ch.${m.read||0}${m.total?'/'+m.total:''}</div>
        ${m.total ? `<div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ---- DETAIL ----
function showDetail(id) {
  const m = library.find(x => x.id === id);
  if(!m) return;
  const pct = m.total ? Math.round((m.read||0)/m.total*100) : 0;
  const cover = m.cover
    ? `<img src="${m.cover}" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='${emoji(m.id)}'"/>`
    : emoji(m.id);

  // generate fake chapters list
  const total = m.total || 10;
  const read = m.read || 0;
  let chaps = '';
  for(let i=1; i<=Math.min(total,20); i++) {
    const isRead = i <= read;
    chaps += `<div class="chapter-item ${isRead?'read':''}" onclick="markRead('${id}',${i})">
      <span class="ch-title">Chapter ${i}</span>
      <span class="ch-badge ${isRead?'':'unread'}">${isRead?'read':'unread'}</span>
    </div>`;
  }
  if(total > 20) chaps += `<div style="text-align:center;color:var(--muted);font-size:0.72rem;padding:12px">+ ${total-20} more chapters</div>`;

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-hero">
      <div class="detail-cover">${cover}</div>
      <div class="detail-info">
        <div class="detail-title">${m.title}</div>
        <div class="detail-author">by ${m.author || 'Unknown Author'}</div>
        <div class="detail-stats">
          <div class="stat"><div class="stat-label">Status</div><div class="stat-value">${m.status}</div></div>
          <div class="stat"><div class="stat-label">Progress</div><div class="stat-value">${m.read||0}${m.total?'/'+m.total:''} ch</div></div>
          <div class="stat"><div class="stat-label">Complete</div><div class="stat-value">${pct}%</div></div>
        </div>
        <div class="detail-actions">
          <button class="btn-read" onclick="showReader('${id}')">▶ Continue Reading</button>
          <button class="btn-action ${m.bookmarked?'active':''}" onclick="toggleBookmark('${id}')">♥ ${m.bookmarked?'Saved':'Save'}</button>
          <button class="btn-action" onclick="openEditModal('${id}')">✎ Edit</button>
          <button class="btn-action" onclick="deleteManhwa('${id}')" style="color:var(--danger)">✕ Remove</button>
        </div>
      </div>
    </div>
    ${m.total ? `<div class="detail-progress">
      <div class="progress-label">Reading progress — ${pct}%</div>
      <div class="progress-big-wrap"><div class="progress-big" style="width:${pct}%"></div></div>
    </div>` : ''}
    ${m.notes ? `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);line-height:1.6">${m.notes}</div>` : ''}
    <div class="chapters-section">
      <div class="section-title">Chapters</div>
      <div class="chapters-list">${chaps}</div>
    </div>
  `;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-detail').classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
}

function markRead(id, ch) {
  const m = library.find(x => x.id === id);
  if(!m) return;
  m.read = Math.max(m.read||0, ch);
  save();
  showDetail(id);
  toast(`Chapter ${ch} marked as read!`);
}

// ---- READER ----
function showReader(id) {
  const m = library.find(x => x.id === id);
  if(!m) return;
  const ch = (m.read||0) + 1;
  document.getElementById('reader-content').innerHTML = `
    <button class="detail-back" onclick="showDetail('${id}')">← Back to ${m.title}</button>
    <div class="reader-header">
      <div class="reader-title">${m.title} — Chapter ${ch}</div>
      <button class="btn-action" onclick="markRead('${id}',${ch});showReader('${id}')">Mark Read ✓</button>
    </div>
    <div class="reader-images">
      ${[1,2,3,4,5].map(i=>`<div class="reader-page-placeholder">
        📖 Page ${i}<br><span style="font-size:0.72rem;margin-top:8px;display:block">Add your chapter images here.<br>Paste image URLs when editing the manhwa.</span>
      </div>`).join('')}
    </div>
    <div class="reader-nav">
      <button class="btn-action" onclick="showDetail('${id}')">← Back</button>
      <button class="btn-read" onclick="markRead('${id}',${ch});showReader('${id}')">Next Chapter →</button>
    </div>
  `;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-reader').classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
}

// ---- BOOKMARKS ----
function toggleBookmark(id) {
  const m = library.find(x => x.id === id);
  if(!m) return;
  m.bookmarked = !m.bookmarked;
  save();
  showDetail(id);
  toast(m.bookmarked ? '♥ Added to saved!' : 'Removed from saved');
}

function renderBookmarks() {
  const list = document.getElementById('bookmarks-list');
  const bm = library.filter(m => m.bookmarked);
  if(!bm.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🔖</div><p>No saved titles yet~<br>Tap ♥ Save on any manhwa!</p></div>`;
    return;
  }
  list.innerHTML = bm.map(m => `
    <div class="bookmark-item" onclick="showDetail('${m.id}')">
      <div class="bm-icon">${emoji(m.id)}</div>
      <div class="bm-info">
        <div class="bm-title">${m.title}</div>
        <div class="bm-meta">${m.author||'Unknown'} · Ch.${m.read||0}${m.total?'/'+m.total:''} · ${m.status}</div>
      </div>
      <button class="bm-remove" onclick="event.stopPropagation();toggleBookmark('${m.id}');renderBookmarks()">✕</button>
    </div>
  `).join('');
}

// ---- PROGRESS ----
function renderProgress() {
  const cards = document.getElementById('progress-cards');
  const active = library.filter(m => m.total && m.read > 0);
  if(!active.length) {
    cards.innerHTML = `<div class="empty-state"><div class="icon">📈</div><p>Start reading to track progress~</p></div>`;
    return;
  }
  cards.innerHTML = active.map(m => {
    const pct = Math.round((m.read||0)/m.total*100);
    return `<div class="prog-card" onclick="showDetail('${m.id}')">
      <div class="prog-header">
        <div class="prog-icon">${emoji(m.id)}</div>
        <div class="prog-title-wrap">
          <div class="prog-title">${m.title}</div>
          <div class="prog-sub">${m.author||'Unknown'} · ${m.status}</div>
        </div>
        <div class="prog-pct">${pct}%</div>
      </div>
      <div class="prog-bar-track"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
      <div style="font-size:0.68rem;color:var(--muted);margin-top:8px">Chapter ${m.read} of ${m.total}</div>
    </div>`;
  }).join('');
}

// ---- ADD / EDIT MODAL ----
function openAddModal() {
  editingId = null;
  document.querySelector('.modal-title').textContent = 'Add Manhwa';
  ['title','author','total','read','cover','notes'].forEach(f => document.getElementById('inp-'+f).value = '');
  document.getElementById('inp-status').value = 'reading';
  document.getElementById('add-modal').classList.add('open');
}

function openEditModal(id) {
  const m = library.find(x => x.id === id);
  if(!m) return;
  editingId = id;
  document.querySelector('.modal-title').textContent = 'Edit Manhwa';
  document.getElementById('inp-title').value = m.title||'';
  document.getElementById('inp-author').value = m.author||'';
  document.getElementById('inp-total').value = m.total||'';
  document.getElementById('inp-read').value = m.read||'';
  document.getElementById('inp-status').value = m.status||'reading';
  document.getElementById('inp-cover').value = m.cover||'';
  document.getElementById('inp-notes').value = m.notes||'';
  document.getElementById('add-modal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function saveManhwa() {
  const title = document.getElementById('inp-title').value.trim();
  if(!title) { toast('Please enter a title!'); return; }
  const data = {
    title,
    author: document.getElementById('inp-author').value.trim(),
    total: parseInt(document.getElementById('inp-total').value)||0,
    read: parseInt(document.getElementById('inp-read').value)||0,
    status: document.getElementById('inp-status').value,
    cover: document.getElementById('inp-cover').value.trim(),
    notes: document.getElementById('inp-notes').value.trim(),
  };
  if(editingId) {
    const idx = library.findIndex(x => x.id === editingId);
    library[idx] = { ...library[idx], ...data };
    toast('Updated!');
  } else {
    library.unshift({ id: uid(), bookmarked: false, addedAt: Date.now(), ...data });
    toast('Added to library!');
  }
  save();
  closeAddModal();
  if(editingId) showDetail(editingId);
  else renderLibrary();
}

function deleteManhwa(id) {
  library = library.filter(x => x.id !== id);
  save();
  showPage('library');
  toast('Removed from library');
}

// ---- TOAST ----
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- INIT ----
renderLibrary();

// close modal on overlay click
document.getElementById('add-modal').addEventListener('click', function(e) {
  if(e.target === this) closeAddModal();
});
</script>
</body>
</html>
